<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ResumeAI Pro</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold" href="/">ResumeAI Pro</a>
        <small class="text-secondary">
AI Resume Screening Platform
</small>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/about">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/contact">Contact</a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<div class="container py-5">

    <div class="text-center mb-5">

        <h1 class="display-4 fw-bold">

            Beat ATS<br>
            Land More Interviews

        </h1>

        <p class="lead">

            AI Powered Resume Screening Platform

        </p>

    </div>

    <div class="card shadow-lg p-4">

        <form
id="resumeForm"
action="/upload"
method="POST"
enctype="multipart/form-data">

            <div class="mb-4">

                <label class="form-label fw-bold">

                    Upload Resume (PDF)

                </label>

                <input
                    type="file"
                    class="form-control"
                    name="resume"
                    accept=".pdf"
                    required>

            </div>

            <div class="mb-4">

                <label class="form-label fw-bold">

                    Job Description

                </label>

                <textarea
                    class="form-control"
                    rows="8"
                    name="job_description"
                    placeholder="Paste the Job Description here..."></textarea>

            </div>

            <div class="text-center">

               <button
id="analyzeBtn"
class="btn btn-primary btn-lg upload-btn">

Analyze Resume

</button>

            </div>

        </form>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>

document
.getElementById("resumeForm")
.addEventListener("submit",function(){

let btn=document.getElementById("analyzeBtn");

btn.innerHTML="⏳ Analyzing Resume...";

btn.disabled=true;

});

</script>
</body>

</html>
